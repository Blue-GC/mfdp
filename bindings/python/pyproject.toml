[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfdp"
version = "1.0.0"
description = "Python binding for the Model File Definition Protocol (MFDP)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Blue GC" }]

[tool.setuptools]
packages = ["mfdp"]
